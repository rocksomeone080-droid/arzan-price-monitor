name: arzan-price-monitor
on:
  schedule:
    - cron: "0 4 * * *"   # күн сайын 09:00 (Астана, UTC+5)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python price_monitor.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - run: |
          git config user.name "price-monitor"; git config user.email "bot@users.noreply.github.com"
          git add price_history.csv; git diff --cached --quiet || git commit -m "price check $(date -u +%F)" && git push
